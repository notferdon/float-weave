<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOAT</title>
<style>
  @font-face {
    font-family: 'TeX Gyre Heros';
    src: url('assets/fonts/TeXGyreHeros-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'TeX Gyre Heros';
    src: url('assets/fonts/TeXGyreHeros-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: block;
  }
  :root {
    --sans: 'TeX Gyre Heros', Helvetica, Arial, sans-serif;
    --ink: #000;
    --muted: #949494;
    --copy: #444;
    --hair: #e2e2e2;
    /* ferdon.dev type system (site.css): one family, 400/700, tabular figures. */
    --type-statement: clamp(22px, 2.2vw, 34px);
    --type-body: 13px;
    --type-label: 10px;
    --label-tracking: 0.10em;
    /* ferdon.dev page inset: the viewport, not a centred sheet, sets the outer margin. */
    --inset: clamp(20px, 4vw, 64px);
  }
  * { box-sizing: border-box; }
  html, body { background: #fff; }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans);
    font-size: var(--type-body); line-height: 1.5;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  .label {
    font-size: var(--type-label); font-weight: 700; letter-spacing: var(--label-tracking);
    text-transform: uppercase; color: var(--muted);
  }
  .grid {
    display: grid; grid-template-columns: 260px 1fr 232px; gap: 0;
    padding: 56px var(--inset);
    min-height: 100vh;
  }
  .col { padding: 0 40px; }
  .col-left { padding-left: 0; border-right: 1px solid var(--hair); display: flex; flex-direction: column; }
  .col-center { border-right: 1px solid var(--hair); display: flex; flex-direction: column; align-items: center; }
  .col-right { padding-right: 0; display: flex; flex-direction: column; }

  h1 {
    font: 400 var(--type-statement)/1.1 var(--sans); margin: 0; letter-spacing: -0.025em;
  }
  .descriptor {
    margin-top: 18px; font-size: var(--type-body); line-height: 1.6; color: var(--copy); max-width: 220px;
  }
  .col-left .spacer { flex: 1; min-height: 40px; }
  .source-block { text-align: left; }
  /* Witness row: the loupe carries a 26px caliper band under its grid; this margin (26 + the
     caption's 8, which collapses into it) puts the source image's bottom on the loupe grid's. */
  .source-block canvas { display: block; image-rendering: pixelated; margin-bottom: 34px; }
  .source-block .cap { margin-top: 8px; }

  .col-center .plate-wrap { width: 100%; max-width: 720px; }
  #c-hero { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .state-line { margin-top: 18px; font: var(--type-body)/1 var(--sans); text-align: left; }
  .state-line.refused { color: #a33; }

  .select-l { }
  .l-set { display: flex; gap: 20px; margin-top: 14px; }
  .l-opt {
    background: none; border: none; padding: 0 0 4px; cursor: pointer;
    font: 20px var(--sans); color: var(--muted); border-bottom: 1px solid transparent;
  }
  .l-opt.active { color: var(--ink); border-bottom-color: var(--ink); }
  .l-opt:focus { outline: none; }
  .l-opt:focus-visible {
    color: var(--ink); text-decoration: underline;
    text-decoration-thickness: 1px; text-underline-offset: 2px;
  }

  .col-right .block { margin-top: 40px; }
  .claim { font-size: var(--type-body); line-height: 1.6; color: var(--copy); max-width: 220px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions button {
    background: none; border: none; cursor: pointer; padding: 0; text-align: left;
    font: var(--type-body)/1.5 var(--sans); color: var(--ink);
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
  }
  .actions button:hover { color: var(--muted); }
  .actions button:focus { outline: none; }
  .actions button:focus-visible { text-decoration-thickness: 2px; }
  #file { display: none; }

  .col-right .spacer { flex: 1; min-height: 30px; }
  .loupe-block { text-align: left; }
  .loupe-block canvas { display: block; image-rendering: pixelated; }
  .loupe-block .cap { margin-top: 8px; }

  .inspect-panel {
    display: none; padding: 30px var(--inset) 40px;
    border-top: 1px solid var(--hair); font-size: var(--type-body); color: #444;
  }
  .inspect-panel.open { display: block; }
  .inspect-panel canvas { image-rendering: pixelated; margin-top: 10px; }
  .inspect-panel .row { margin-top: 6px; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; padding: 32px 20px; }
    .col { padding: 28px 0; border-right: none !important; border-bottom: 1px solid var(--hair); }
    .col-right { border-bottom: none; }
    .col-center { order: 1; align-items: flex-start; }
    .col-left { order: 2; }
    .col-right { order: 3; }
    .descriptor, .claim { max-width: none; }
    .col-left .spacer { display: none; }
    .col-right .spacer { flex: none; min-height: 0; height: 30px; }
    .source-block { margin-top: 24px; }
    .source-block canvas { margin-bottom: 0; }
  }
</style>

<div class="grid">
  <div class="col col-left">
    <h1>FLOAT</h1>
    <div class="descriptor">Binary two-shed structure,<br>bound in warp and weft.</div>
    <div class="spacer"></div>
    <div class="source-block">
      <canvas id="c-ref"></canvas>
      <div class="cap label">Source, cropped</div>
    </div>
  </div>

  <div class="col col-center">
    <div class="plate-wrap">
      <canvas id="c-hero"></canvas>
      <div class="state-line mono" id="state-line">solving&hellip;</div>
    </div>
  </div>

  <div class="col col-right">
    <div class="select-l">
      <div class="label">Select L</div>
      <div class="l-set" id="l-set">
        <button class="l-opt" data-l="1">1</button>
        <button class="l-opt" data-l="2">2</button>
        <button class="l-opt active" data-l="3">3</button>
        <button class="l-opt" data-l="5">5</button>
        <button class="l-opt" data-l="8">8</button>
      </div>
    </div>

    <div class="block claim">
      Float-legal at L by construction.<br>Not a woven or weavable claim.
    </div>

    <div class="block actions">
      <button id="open-image">Open image</button>
      <button id="inspect-toggle">Inspect structure</button>
      <input id="file" type="file" accept="image/*">
    </div>

    <div class="spacer"></div>

    <div class="loupe-block" id="loupe-wrap" style="display:none">
      <canvas id="c-loupe"></canvas>
      <div class="cap label">A run of L</div>
    </div>
  </div>
</div>

<div class="inspect-panel" id="inspect-panel">
  <div class="row">Flat drawdown, one pixel per intersection.</div>
  <canvas id="c-drawdown"></canvas>
  <div class="row mono" id="inspect-detail">&mdash;</div>
</div>

<script src="../float-core.js"></script>
<script src="limit-trace.js"></script>
<script src="app.js"></script>
</html>
